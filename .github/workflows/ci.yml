name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: apply, prove isolation, reproduce every leak
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: rls_demo
      SUPER: "postgres://postgres:postgres@localhost:5432/rls_demo"
      APP: "postgres://app_user:local_dev_only@localhost:5432/rls_demo"
      OWNER: "postgres://demo_owner:local_dev_only@localhost:5432/rls_demo"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # One call, not nine inline copies. The nine steps used to live here as well as in
      # the script, which is the drift CLAUDE.md claims this arrangement prevents — and
      # running the script here is also the only check that its paths work outside the
      # compose container, which for a while they did not.
      - name: Apply everything and prove it
        run: ./scripts/prove.sh

      - name: The client helper upholds the rule through a real pool
        run: npm run prove
        env:
          DATABASE_URL: postgres://app_user:local_dev_only@localhost:5432/rls_demo

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
